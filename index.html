<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            background: #FFD700; 
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
            touch-action: none; 
            position: relative;
        }
        .main-menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #FFD700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 15px;
            padding: 20px;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        .main-menu-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
        }
        .menu-box {
            width: 92vw;
            height: 75px;
            background: #1a252f;
            border: 3.5px solid #00ffcc;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFD700;
            font-size: 1.8em;
            font-weight: 900;
            box-shadow: 0 6px 0 #0f171e;
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
        }
        .menu-box:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
        .game-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            z-index: 2;
            padding: 2px 0;
        }
        .top-panel-wrapper {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            flex: 0 0 auto;
        }
        .player-column {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 3px;
            cursor: pointer;
        }
        .player-label {
            font-size: 1.15em;
            font-weight: 900;
            color: #1a252f;
            text-align: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
        .winner-label-red-blink {
            animation: redBlinkText 0.5s infinite alternate !important;
        }
        @keyframes redBlinkText {
            0% { color: #1a252f; text-shadow: none; }
            100% { color: #ff3333; text-shadow: 0 0 8px #ff0000; }
        }
        .custom-rect { 
            flex: 1; 
            width: 100%;
            min-height: 70px;
            background: #1a252f; 
            border: 3px solid #FFD700; 
            border-radius: 10px; 
            box-shadow: 0 5px 0 #0f171e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            transition: transform 0.1s, filter 0.1s; 
        }
        .player-column:active .custom-rect {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
        .sum-text { font-size: 2.3em; font-weight: 900; color: #00ffcc; line-height: 1; font-family: 'Arial Black', sans-serif; }
        .flash-glow { animation: quickFlash 0.35s ease forwards; }
        @keyframes quickFlash {
            0% { background: #1a252f; }
            50% { background: #004d40; border-color: #fff; }
            100% { background: #1a252f; }
        }
        .winner-rect-red-blink {
            animation: redBlinkBox 0.5s infinite alternate !important;
        }
        @keyframes redBlinkBox {
            0% { 
                background: #1a252f; 
                border-color: #FFD700; 
                box-shadow: 0 5px 0 #0f171e; 
            }
            100% { 
                background: #cc0000; 
                border-color: #ff9999; 
                box-shadow: 0 5px 0 #660000; 
            }
        }
        .small-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(8, 1fr); 
            gap: 6px; 
            width: 100%; 
            flex: 1; 
            margin: 6px 0; 
            perspective: 1000px; 
        }
        .flip-card { 
            width: 100%; 
            height: 100%; 
            cursor: pointer; 
            transform-style: preserve-3d; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
        }
        .flip-card.flipped { transform: rotateY(180deg); }
        .front { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-radius: 6px; 
            background: #000000; 
            border: none; 
            box-shadow: 0 3px 0 #222222; 
            font-weight: 900; 
            -webkit-text-stroke: 1.2px #FFD700; 
            font-size: 2.15em; 
            color: #FFD700; 
            transition: opacity 0.3s ease; 
        }
        .front.hidden-number { opacity: 0; }
        .back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 6px; 
            background: white; 
            transform: rotateY(180deg); 
            border: 1.5px solid #ddd; 
            font-weight: 900; 
            transition: all 0.3s ease; 
        }
        .val-text { font-size: 2.1em; color: black; font-weight: 900; }
        .key-content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 0.95;
            transform: scaleY(0.85);
        }
        .key-text { font-size: 1.65em; color: #FFD700; font-weight: 900; }
        .key-icon { font-size: 1.35em; margin-bottom: -2px; }
        .glowing-gold { 
            animation: superPulse 0.5s infinite alternate !important; 
            border: 3px solid #FFD700 !important; 
            background: #fffdf0 !important; 
        }
        @keyframes superPulse { 
            0% { transform: scale(1) rotateY(180deg); box-shadow: 0 0 6px gold, inset 0 0 10px rgba(255, 215, 0, 0.5); filter: brightness(1); } 
            100% { transform: scale(1.04) rotateY(180deg); box-shadow: 0 0 22px #fff, 0 0 35px gold, inset 0 0 20px rgba(255, 255, 255, 0.9); filter: brightness(1.25); } 
        }
        .row-glow-effect { border: 3px solid #00897b !important; background: #e0f2f1 !important; }
        .vortex-mix-anim {
            animation: realisticVortex 2.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes realisticVortex {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); z-index: 1; }
            25% { transform: translate(var(--dx), var(--dy)) scale(0.28) rotate(360deg); z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
            50% { transform: translate(var(--dx), var(--dy)) scale(0.22) rotate(720deg) scale(1.05); z-index: 100; box-shadow: 0 15px 25px rgba(0,0,0,0.7); }
            75% { transform: translate(var(--dx), var(--dy)) scale(0.25) rotate(900deg); z-index: 100; }
            100% { transform: translate(0, 0) scale(1) rotate(1080deg); z-index: 1; }
        }
    </style>
</head>
<body onclick="makeFullScreen()">

    <div id="mainMenu" class="main-menu-overlay">
        <div class="menu-box" onclick="playSound('click'); selectGameMode('key')">المفتاح</div>
        <div class="menu-box" onclick="playSound('click'); selectGameMode(3)">الأرقام</div>
        <div class="menu-box" onclick="playSound('click'); selectGameMode(4)">أربع أرقام</div>
        <div class="menu-box" onclick="playSound('click'); selectGameMode(5)">خمس أرقام</div>
    </div>

    <div class="game-viewport" id="gameViewport">
        <div class="top-panel-wrapper">
            <div class="player-column">
                <div id="label1" class="player-label">اللاعب الأول</div>
                <div id="rect1" class="custom-rect"><div id="box1" class="sum-text">0</div></div>
            </div>

            <div class="player-column" onclick="playSound('click'); triggerVortexMix()">
                <div id="label2" class="player-label">اللاعب الثاني</div>
                <div id="rect2" class="custom-rect"><div id="box2" class="sum-text">0</div></div>
            </div>
        </div>

        <div class="small-grid" id="grid"></div>
    </div>

    <script>eval(atob("Ly8gUGFzc3dvcmQgbGlua2VkIHRvIEhhaWRlcgogICAgICAgIGNvbnN0IHNlY3JldFBhc3N3b3JkID0gIkhhaWRlcjIwMjYqIjsgCiAgICAgICAgY29uc3QgZW50ZXJlZFBhc3N3b3JkID0gcHJvbXB0KCLYp9mE2LHYrNin2KEg2KXYr9iu2KfZhCDZg9mE2YXYqSDYp9mE2YXYsdmI2LEg2YTYqti02LrZitmEINin2YTZhNi52KjYqToiKTsKICAgICAgICBpZiAoZW50ZXJlZFBhc3N3b3JkICE9PSBzZWNyZXRQYXNzd29yZCkgewogICAgICAgICAgICBkb2N1bWVudC5ib2R5LmlubmVySFRNTCA9 "<h1 style='text-align:center; margin-top:20vh; color:red;'>عذراً، الوصول مرفوض.</h1>";
            throw new Error("Unauthorized Access");
        }

        let keyMode = false, isKeyFound = false, revealed = false, freeMode = false;
        let mode = 3;
        let openOrder = [];
        let items = [];
        let gameStarted = false; 

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playModernChime(valNum) {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let pentatonic = [349.23, 392.00, 440.00, 523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 1046.50];
                let index = Math.floor(((valNum - 350) / (1000 - 350)) * (pentatonic.length - 1));
                if (index < 0) index = 0;
                if (index >= pentatonic.length) index = pentatonic.length - 1;
                
                let freq = pentatonic[index];
                let chord = [freq, freq * 1.25, freq * 1.5];

                chord.forEach((f, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = i === 0 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(f, now + (i * 0.03));
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.35, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.03));
                    osc.stop(now + 0.45);
                });
            } catch (e) {
                console.log(e);
            }
        }

        function playShuffleSound() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let bufferSize = audioCtx.sampleRate * 2.0; 
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                let whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;

                let filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(1400, now + 1.0);
                filter.frequency.linearRampToValueAtTime(600, now + 2.0);
                filter.Q.value = 3;

                let gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.01, now);
                gainNode.gain.linearRampToValueAtTime(0.35, now + 0.3);
                gainNode.gain.linearRampToValueAtTime(0.25, now + 1.5);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

                whiteNoise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                whiteNoise.start(now);
                whiteNoise.stop(now + 2.0);
            } catch(e) {
                console.log(e);
            }
        }

        function playSound(type, param = 0) {
            try {
                initAudio();
                if (type === 'click') {
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(850, now + 0.06);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'gentle-reveal') {
                    let valNum = parseInt(param);
                    if (isNaN(valNum)) valNum = 500;
                    playModernChime(valNum);
                } else if (type === 'finish-sound') {
                    let now = audioCtx.currentTime;
                    let notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.08));
                        gain.gain.setValueAtTime(0, now + (idx * 0.08));
                        gain.gain.linearRampToValueAtTime(0.4, now + (idx * 0.08) + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + (idx * 0.08) + 0.35);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (idx * 0.08));
                        osc.stop(now + (idx * 0.08) + 0.35);
                    });
                } else if (type === 'ta-da') {
                    let now = audioCtx.currentTime;
                    let keyArpeggio = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    keyArpeggio.forEach((freq, idx) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.09));
                        gain.gain.setValueAtTime(0, now + (idx * 0.09));
                        gain.gain.linearRampToValueAtTime(0.45, now + (idx * 0.09) + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + (idx * 0.09) + 0.5);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (idx * 0.09));
                        osc.stop(now + (idx * 0.09) + 0.5);
                    });
                }
            } catch (e) {
                console.log(e);
            }
        }

        let baseItems = [
            '1000', 
            950, 950, 
            900, 900, 
            850, 850, 850, 
            800, 800, 800, 
            750, 750, 750, 
            700, 700, 700, 
            650, 650, 650, 
            600, 600, 600, 
            550, 550, 550, 
            500, 500, 500, 
            350, 350, 350  
        ];

        function shuffleArray(array) {
            let arr = [...array];
            for (let round = 0; round < 5; round++) {
                for (let i = arr.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }
            return arr;
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            items = shuffleArray(baseItems);
            for(let i=0; i<32; i++) {
                let val = items[i];
                let isKey = (val == 1000);
                grid.innerHTML += `
                    <div class="flip-card" data-index="${i}" onclick="handleCardClick(${i})">
                        <div class="front" id="front-${i}">${i+1}</div>
                        <div class="back ${isKey ? 'glowing-gold' : ''}">
                            ${isKey ? '<div class="key-content-box"><div class="key-icon">🔑</div><div class="key-text">1000</div></div>' : '<div class="val-text">'+val+'</div>'}
                        </div>
                    </div>`;
            }
        }

        function selectGameMode(selectedMode) {
            gameStarted = true;
            if (selectedMode === 'key') {
                keyMode = true;
                isKeyFound = false;
                freeMode = false;
            } else {
                keyMode = false;
                mode = selectedMode;
                freeMode = false;
            }
            document.getElementById('mainMenu').classList.add('hidden');
            resetAndShuffle();
        }

        function triggerVortexMix() {
            gameStarted = false;
            const cards = document.querySelectorAll('.flip-card');
            const fronts = document.querySelectorAll('.front');
            
            fronts.forEach(front => front.classList.add('hidden-number'));
            playShuffleSound();

            cards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const parentRect = card.parentElement.getBoundingClientRect();
                
                const centerX = parentRect.width / 2;
                const centerY = parentRect.height / 2;
                
                const cardCenterX = rect.left - parentRect.left + (rect.width / 2);
                const cardCenterY = rect.top - parentRect.top + (rect.height / 2);
                
                const dx = centerX - cardCenterX;
                const dy = centerY - cardCenterY;

                card.style.setProperty('--dx', `${dx}px`);
                card.style.setProperty('--dy', `${dy}px`);
                
                card.classList.add('vortex-mix-anim');
            });

            setTimeout(() => {
                resetAndShuffle();
            }, 1000);

            setTimeout(() => {
                cards.forEach(card => {
                    card.classList.remove('vortex-mix-anim');
                    card.style.removeProperty('--dx');
                    card.style.removeProperty('--dy');
                });
                
                setTimeout(() => {
                    const newFronts = document.querySelectorAll('.front');
                    newFronts.forEach(front => front.classList.remove('hidden-number'));
                    document.getElementById('mainMenu').classList.remove('hidden');
                }, 100);
            }, 2000);
        }

        function handleCardClick(index) {
            if (!gameStarted) return;

            const cards = document.querySelectorAll('.flip-card');
            const el = cards[index];
            let val = items[index];

            if (keyMode) {
                if (isKeyFound) return;
                
                let rowIndex = Math.floor(index / 4);
                let startIndex = rowIndex * 4;

                let rowContainsKeys = false;
                for (let i = 0; i < 4; i++) {
                    let targetCard = cards[startIndex + i];
                    if (targetCard) {
                        let cardBack = targetCard.querySelector('.back');
                        if (cardBack.innerHTML.includes('1000')) {
                            rowContainsKeys = true;
                        }
                    }
                }

                for (let i = 0; i < 4; i++) {
                    let targetCard = cards[startIndex + i];
                    if (targetCard && !targetCard.classList.contains('flipped')) {
                        let cardVal = items[startIndex + i];
                        let isKeyItem = (cardVal == 1000);

                        setTimeout(() => {
                            targetCard.classList.add('flipped');
                            if (isKeyItem) {
                                isKeyFound = true;
                            } else {
                                playSound('gentle-reveal', cardVal);
                            }
                        }, i * 180);
                    }
                }

                if (rowContainsKeys) {
                    for (let i = 0; i < 4; i++) {
                        let targetCard = cards[startIndex + i];
                        if (targetCard) {
                            let cardBack = targetCard.querySelector('.back');
                            if (!cardBack.classList.contains('row-glow-effect')) {
                                cardBack.classList.add('row-glow-effect');
                            }
                        }
                    }
                }

                setTimeout(() => {
                    if (rowContainsKeys) {
                        playSound('ta-da');
                    }
                }, 300);

                return;
            }

            if (el.classList.contains('flipped')) {
                let orderIdx = openOrder.findIndex(item => item.index === index);
                if (orderIdx !== -1) {
                    openOrder.splice(orderIdx, 1);
                    el.classList.remove('flipped');
                    updateSums();
                    playSound('click');
                }
            } else {
                el.classList.add('flipped');
                playSound('gentle-reveal', val);

                if (!freeMode && !revealed) {
                    let totalRequired = mode * 2;
                    let currentIndexCount = openOrder.length;
                    
                    openOrder.push({ index: index, val: val });
                    updateSums();

                    let activeRectId = (currentIndexCount < mode) ? 'rect1' : 'rect2';
                    let activeRect = document.getElementById(activeRectId);
                    
                    activeRect.classList.remove('flash-glow');
                    void activeRect.offsetWidth; 
                    activeRect.classList.add('flash-glow');

                    if (openOrder.length === totalRequired) {
                        setTimeout(() => {
                            playSound('finish-sound'); 
                        }, 500);
                    }
                }
            }
        }

        function updateSums() {
            if (keyMode) {
                document.getElementById('box1').innerText = 0;
                document.getElementById('box2').innerText = 0;
                document.getElementById('rect1').classList.remove('winner-rect-red-blink');
                document.getElementById('rect2').classList.remove('winner-rect-red-blink');
                document.getElementById('label1').classList.remove('winner-label-red-blink');
                document.getElementById('label2').classList.remove('winner-label-red-blink');
                return;
            }

            let s1 = 0, s2 = 0;
            openOrder.forEach((item, index) => {
                let val = parseInt(item.val);
                if(index < mode) s1 += val;
                else if(index < (mode * 2)) s2 += val;
            });
            
            document.getElementById('box1').innerText = s1;
            document.getElementById('box2').innerText = s2;

            let rect1 = document.getElementById('rect1');
            let rect2 = document.getElementById('rect2');
            let label1 = document.getElementById('label1');
            let label2 = document.getElementById('label2');

            rect1.classList.remove('winner-rect-red-blink');
            rect2.classList.remove('winner-rect-red-blink');
            label1.classList.remove('winner-label-red-blink');
            label2.classList.remove('winner-label-red-blink');

            if (openOrder.length >= (mode * 2)) {
                if (s1 > s2) {
                    rect1.classList.add('winner-rect-red-blink');
                    label1.classList.add('winner-label-red-blink');
                } else if (s2 > s1) {
                    rect2.classList.add('winner-rect-red-blink');
                    label2.classList.add('winner-label-red-blink');
                }
            }
        }

        function clearSums() {
            document.getElementById('box1').innerText = 0;
            document.getElementById('box2').innerText = 0;
            document.getElementById('rect1').classList.remove('winner-rect-red-blink', 'flash-glow');
            document.getElementById('rect2').classList.remove('winner-rect-red-blink', 'flash-glow');
            document.getElementById('label1').classList.remove('winner-label-red-blink');
            document.getElementById('label2').classList.remove('winner-label-red-blink');
            openOrder = [];
        }

        function resetAndShuffle() {
            revealed = false; isKeyFound = false;
            let cards = Array.from(document.querySelectorAll('.flip-card'));
            for(let card of cards) {
                card.classList.remove('flipped');
                let cardBack = card.querySelector('.back');
                if(cardBack) cardBack.classList.remove('row-glow-effect');
            }
            clearSums();
            renderGrid();
        }

        function makeFullScreen() { 
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
        }
        
        renderGrid();
    </script>
</body>
</html>
